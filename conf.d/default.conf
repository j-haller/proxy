# Single server for all apps: each app lives under its own path prefix, e.g. http://<server>/home-dashboard/
server {
    listen 80 default_server;
    server_name _;

    # Docker DNS: resolve app containers at request time, so nginx starts even if an app is down
    resolver 127.0.0.11 valid=10s;

    location = / {
        return 404;
    }

    # One file per app with its location blocks (kept outside conf.d/*.conf, which loads at http level)
    include conf.d/apps/*.conf;
}
