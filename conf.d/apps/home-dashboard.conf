# home-dashboard: http://<server>/home-dashboard/ -> home-dashboard:8080 (prefix stripped)

# Trailing slash required: the app uses relative URLs (sse, api/...)
location = /home-dashboard {
    return 301 /home-dashboard/;
}

location /home-dashboard/sse {
    set $app http://home-dashboard:8080;
    # proxy_pass with a variable does not strip the location prefix, so rewrite explicitly
    rewrite ^/home-dashboard(/.*)$ $1 break;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix /home-dashboard;
    proxy_buffering off;
    proxy_read_timeout 24h;
}

location /home-dashboard/ {
    set $app http://home-dashboard:8080;
    rewrite ^/home-dashboard(/.*)$ $1 break;
    proxy_pass $app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix /home-dashboard;
}
